name: Shopify Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: |
          npm install -g @shopify/cli @shopify/theme
          shopify help

      - name: Set PR number
        id: vars
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Deploy to theme
        run: |
          # Create a unique theme name using PR number
          THEME_NAME="PR #${PR_NUMBER}"

          # Check if theme exists
          THEME_ID=$(shopify theme list | grep "$THEME_NAME" | awk '{print $1}')

          if [ -z "$THEME_ID" ]; then
            echo "Creating new theme for PR #${PR_NUMBER}"
            shopify theme push \
              --json \
              --unpublished \
              --theme-name "$THEME_NAME"
          else
            echo "Updating existing theme ID: $THEME_ID"
            shopify theme push \
              --json \
              --theme-id "$THEME_ID"
          fi
        env:
          SHOPIFY_CLI_AUTH_TOKEN: ${{ secrets.SHOPIFY_CLI_AUTH_TOKEN_NEW }}
